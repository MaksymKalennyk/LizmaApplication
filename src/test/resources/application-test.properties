# In-memory database for tests: no Docker or .env needed.
spring.datasource.url=jdbc:h2:mem:lizma;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
# The migrations are MySQL SQL; MigrationTest checks them on a real MySQL.
spring.flyway.enabled=false
token.signing.key=bGl6bWEtdGVzdC1zaWduaW5nLWtleS0zMi1ieXRlcyE=
# No moderation emails unless a test turns them on; the scheduled run never starts during a test.
spring.mail.host=
app.notify.initial-delay=PT24H
# Every test request comes from 127.0.0.1: limits per address would trip; RateLimitTest checks them.
app.auth.failures-per-address=100000
app.auth.sign-ups-per-address=100000
# No calls to song.link or iTunes from tests; MusicLinksTest points them at a fake server.
app.links.enabled=false
# The daily push reminder never fires on its own in tests ("-" turns the schedule off); PushNotificationsTest calls it.
app.push.daily-reminder-cron=-
# The hourly clean-up of unsent screenshots doesn't run on its own in tests.
app.attachments.cleanup-cron=-
# The nightly clean-up of widget keys whose sign-in ended doesn't run on its own in tests.
app.extension-keys.cleanup-cron=-
