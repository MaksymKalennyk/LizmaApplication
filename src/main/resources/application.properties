spring.application.name=Lizma

# Local settings (DB_*, SECRET_KEY) are read from .env in the working directory, if present.
# Real environment variables still take precedence. See .env.example.
spring.config.import=optional:file:.env[.properties]

#Data
spring.datasource.url=jdbc:mysql://localhost:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update

#JWT
token.signing.key=${SECRET_KEY}
# How long a sign-in stays valid (e.g. 12h, 7d)
token.ttl=7d

#App
app.externalBaseUrl=http://localhost:8080
app.invites.pathPrefix=/i
app.invites.ttlHours=168

# Legal pages (/privacy, /terms) and the support contact shown in the app.
# TODO before publishing: real operator name and a support mailbox you read.
app.legal.operator-name=Lizma
app.legal.contact-email=support@example.com
app.legal.last-updated=2026-11-15

# Moderators: comma-separated usernames that get the admin role at startup (handle /admin/reports)
app.admin-usernames=

# ==== Spotify (PKCE) ====
spotify.clientId=886cea2ad68346a597acede21adaf379
spotify.redirectUri=lizma://oauth-callback/spotify

# ==== Apple Music ====
apple.devToken=FUTURE_APPLE_MUSIC_TOKEN