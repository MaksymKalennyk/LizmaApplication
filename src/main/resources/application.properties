spring.application.name=Lizma

# Local settings (DB_*, SECRET_KEY) are read from .env in the working directory, if present.
# Real environment variables still take precedence. See .env.example.
spring.config.import=optional:file:.env[.properties]

#Data
spring.datasource.url=jdbc:mysql://localhost:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
# The schema comes from Flyway migrations (src/main/resources/db/migration); Hibernate only checks it.
spring.jpa.hibernate.ddl-auto=validate
# A database created before migrations existed is taken as being at V1 (the baseline) without running it.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

#JWT
token.signing.key=${SECRET_KEY}
# Access tokens (JWT) are short-lived; the app trades its refresh token for a new pair (POST /auth/refresh).
token.ttl=15m
# A session ends after this long without the app being used (every refresh starts the period again).
token.refresh-ttl=30d

# Sign-in limits: failed attempts per username and per IP address in the window, sign-ups per IP and hour.
app.auth.failures-per-username=5
app.auth.failures-per-address=30
app.auth.failure-window=15m
app.auth.sign-ups-per-address=10
app.auth.sign-up-window=1h

# Encrypts music service tokens in the database (ENCRYPTION_KEY in .env, Base64 of 32 bytes:
# openssl rand -base64 32). Without it a key is derived from SECRET_KEY; set it in production.
app.encryption-key=${ENCRYPTION_KEY:}

# Profile photos are uploaded as multipart; the app sends ~1 MB, the server accepts up to 10 MB.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

#App
app.externalBaseUrl=http://localhost:8080
app.invites.pathPrefix=/i
app.invites.ttlHours=168

# Legal pages (/privacy, /terms) and the support contact shown in the app.
# TODO before publishing: the real operator name (the person or company responsible for the app).
app.legal.operator-name=Lizma
app.legal.contact-email=lizma.support@gmail.com
app.legal.last-updated=2026-11-24

# Moderators: exactly these usernames (comma-separated, ADMIN_USERNAMES in .env) are admins; at startup
# everyone else loses the role. They see Profile -> Moderation in the app.
app.admin-usernames=${ADMIN_USERNAMES:}

# Moderation emails: new reports and feedback, mailed as a digest every few minutes (ModerationMailer).
# Off unless MAIL_HOST is set. For Gmail: MAIL_HOST=smtp.gmail.com, MAIL_USERNAME=the address,
# MAIL_PASSWORD=an app password (Google account -> Security -> 2-Step Verification -> App passwords).
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
# Where they go (the support mailbox unless NOTIFY_TO says otherwise) and how often.
app.notify.to=${NOTIFY_TO:${app.legal.contact-email}}
app.notify.interval=PT5M

# Links to the same song in other services, looked up on song.link after a post is saved (MusicLinkResolver).
# song.link retired its keyless API in 2026 and gives keys only on request: without ODESLI_API_KEY nothing
# is looked up and the app's "Open in Spotify" opens Spotify's search for the song.
app.links.odesli-key=${ODESLI_API_KEY:}

# ==== Push notifications (APNs) ====
# Needs the paid Apple Developer account: Certificates, Identifiers & Profiles -> Keys -> "+" with
# "Apple Push Notifications service (APNs)" gives a .p8 file and its Key ID; the Team ID is under Membership.
# APNS_KEY_PATH is the .p8 file (or APNS_KEY its text). Without them notifications are only written to the log.
app.push.apns.team-id=${APNS_TEAM_ID:}
app.push.apns.key-id=${APNS_KEY_ID:}
app.push.apns.key-path=${APNS_KEY_PATH:}
app.push.apns.key=${APNS_KEY:}
app.push.apns.topic=${APNS_TOPIC:maxos-industry.lizma}
# "What are you listening to today?" to everyone who hasn't posted yet that day (PushNotifier).
app.push.daily-reminder-cron=0 0 13 * * *
app.push.daily-reminder-zone=Europe/Kyiv

# ==== Spotify (PKCE) ====
spotify.clientId=886cea2ad68346a597acede21adaf379
spotify.redirectUri=lizma://oauth-callback/spotify

# ==== Apple Music ====
apple.devToken=FUTURE_APPLE_MUSIC_TOKEN
# Screenshots attached to reports and feedback that were never sent are deleted after a day (AttachmentService).
app.attachments.cleanup-cron=0 15 * * * *

# Widget keys whose sign-in has ended are deleted every night (WidgetService).
app.widgets.cleanup-cron=0 45 4 * * *
